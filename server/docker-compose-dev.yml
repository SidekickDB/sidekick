services:
  postgres:
    # SidekickDB: its own build of server/dev-postgres (with the wal2json
    # fix), published by sidekick-release-images.yml; not upstream's image.
    image: ghcr.io/sidekickdb/postgresql:postgresql-17-pg-hint-plan
    # SidekickDB: development ports are published on the loopback address
    # only, because Docker-published ports bypass host firewalls.
    ports:
      - '127.0.0.1:8890:5432'
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: instant
      POSTGRES_DB: instant
    volumes:
      - 'backend-db:/var/lib/postgresql/data'
    networks:
      - application
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "instant"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"

  server:
    depends_on:
      - postgres
    build:
      context: ./
      dockerfile: Dockerfile-dev
    environment:
      DATABASE_URL: "postgresql://instant:pass@postgres:5432/instant"
      # SidekickDB: nREPL listens on all container interfaces so the published
      # port reaches it; the port is published on 127.0.0.1 below.
      NREPL_BIND_ADDRESS: "0.0.0.0"
      WAL_HISTORY_STORAGE: "pg"
    volumes:
      - './:/app'
    ports:
      - '127.0.0.1:8888:8888'
      - '127.0.0.1:6005:6005'
    networks:
      - application

networks:
  application:
    driver: bridge
volumes:
  backend-db:

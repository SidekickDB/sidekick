# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  postgres:
    # Needs Postgres 17 with the pg_hint_plan and wal2json extensions.
    image: ${POSTGRES_IMAGE:-ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan}
    ports:
      - "8890:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - "backend-db:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.storage==true
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"
  www:
    image: "${DASHBOARD_IMAGE:-ghcr.io/instantdb/dashboard:latest}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dash').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      INSTANT_BACKEND_URL: ${SERVER_URL:? example http://server.localhost}
    networks:
      - caddy
      - default
    deploy:
      labels:
        caddy: ${DASHBOARD_URL:? example http://dash.localhost}
        caddy.reverse_proxy: "{{upstreams 3000}}"
  storage:
    # S3-compatible object storage. Defaults to RustFS; STORAGE_IMAGE can point at
    # another S3-compatible server (adjust environment and healthcheck to match).
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.6}
    restart: always
    networks:
      - caddy
      - default
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      labels:
        caddy: ${S3_PUBLIC_ENDPOINT:? example http://storage.localhost}
        caddy.reverse_proxy: "{{upstreams 9000}}"
      placement:
        constraints:
          - node.labels.storage==true

  createbuckets:
    # Creates the buckets with the RustFS client `rc`. Any image with `sh` and `rc`
    # works here; another client needs a different entrypoint.
    image: ${STORAGE_CLIENT_IMAGE:-rustfs/rc:v0.1.38}
    environment:
      ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
    entrypoint: >
      /bin/sh -c "
      set -e;
      until rc alias set local http://storage:9000 $$$$ACCESS_KEY $$$$SECRET_KEY; do sleep 2; done;
      rc bucket create --ignore-existing local/$$$$S3_BUCKET;
      rc bucket create --ignore-existing local/$$$$S3_APP_BACKUPS_BUCKET;
      exit"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 20

  server:
    image: "${SERVER_IMAGE:-ghcr.io/instantdb/server:latest}"
    networks:
      - caddy
      - default
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8888/health/system"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    environment:
      SWARM_SERVICE_NAME: server
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: ${CONNECTION_POOL_SIZE:-20}
      INSTANT_BACKEND_URL: ${SERVER_URL:? example http://server.localhost}
      INSTANT_DASHBOARD_URL: ${DASHBOARD_URL:? example http://dash.localhost}
      INSTANT_SUPERUSER_EMAIL: ${INSTANT_SUPERUSER_EMAIL:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      SENDGRID_TOKEN: ${SENDGRID_TOKEN:-}
      RESEND_TOKEN: ${RESEND_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INSTANT_EMAIL_PROVIDER: ${INSTANT_EMAIL_PROVIDER:-}
      INSTANT_EMAIL_REPLY_TO: ${INSTANT_EMAIL_REPLY_TO:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_NAME: ${INSTANT_DASHBOARD_EMAIL_SENDER_NAME:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL: ${INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL:-}
      INSTANT_APP_EMAIL_SENDER_NAME: ${INSTANT_APP_EMAIL_SENDER_NAME:-}
      INSTANT_APP_EMAIL_SENDER_EMAIL: ${INSTANT_APP_EMAIL_SENDER_EMAIL:-}
      INSTANT_TEAM_EMAIL_SENDER_NAME: ${INSTANT_TEAM_EMAIL_SENDER_NAME:-}
      INSTANT_TEAM_EMAIL_SENDER_EMAIL: ${INSTANT_TEAM_EMAIL_SENDER_EMAIL:-}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:? example http://storage.localhost}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
    secrets:
      - source: server_config
        target: /app/resources/config/override.edn
    deploy:
      replicas: 2
      labels:
        caddy: ${SERVER_URL:? ex http://server.localhost}
        caddy.reverse_proxy: "{{upstreams 8888}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    deploy:
      placement:
        constraints:
          - node.labels.caddy==true

volumes:
  backend-db:
  storage_data:
  caddy_data:

secrets:
  server_config:
    external: true

networks:
  caddy:
    external: true

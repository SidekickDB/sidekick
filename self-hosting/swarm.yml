# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  postgres:
    # Needs Postgres 17 with the pg_hint_plan and wal2json extensions.
    image: ${POSTGRES_IMAGE:-ghcr.io/sidekickdb/postgresql:postgresql-17-pg-hint-plan}
    # SidekickDB: Postgres is not published. Swarm publishes a port on every
    # node's interfaces and ignores a host IP, and published ports bypass host
    # firewalls such as ufw. See README.md to publish it anyway.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment; see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - "backend-db:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      placement:
        constraints:
          - node.labels.storage==true
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"
  www:
    image: "${DASHBOARD_IMAGE:-ghcr.io/sidekickdb/dashboard:latest}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dash').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      INSTANT_BACKEND_URL: ${SERVER_URL:? example http://server.localhost}
      # Shows "Continue with Google" on the login page when set.
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}
    networks:
      - caddy
      - default
    deploy:
      labels:
        caddy: ${DASHBOARD_URL:? example http://dash.localhost}
        caddy.reverse_proxy: "{{upstreams 3000}}"
  storage:
    # S3-compatible object storage. Defaults to RustFS; STORAGE_IMAGE can point at
    # another S3-compatible server (adjust environment and healthcheck to match).
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.6}
    restart: always
    networks:
      - caddy
      - default
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in the environment; see .env.example (formerly MINIO_ROOT_USER)}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in the environment; see .env.example (formerly MINIO_ROOT_PASSWORD)}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      labels:
        caddy: ${S3_PUBLIC_ENDPOINT:? example http://storage.localhost}
        caddy.reverse_proxy: "{{upstreams 9000}}"
      placement:
        constraints:
          - node.labels.storage==true

  createbuckets:
    # Creates the buckets with the RustFS client `rc`. Any image with `sh` and `rc`
    # works here; another client needs a different entrypoint.
    # RustFS sends no CORS headers unless a bucket has CORS rules (MinIO allowed
    # every origin by default), so GET/HEAD from any origin is allowed on both
    # buckets. Access still needs a presigned URL.
    image: ${STORAGE_CLIENT_IMAGE:-rustfs/rc:v0.1.38}
    environment:
      ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in the environment; see .env.example (formerly MINIO_ROOT_USER)}
      SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in the environment; see .env.example (formerly MINIO_ROOT_PASSWORD)}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
    entrypoint: >
      /bin/sh -c "
      set -e;
      until rc alias set local http://storage:9000 $$$$ACCESS_KEY $$$$SECRET_KEY; do sleep 2; done;
      rc bucket create --ignore-existing local/$$$$S3_BUCKET;
      rc bucket create --ignore-existing local/$$$$S3_APP_BACKUPS_BUCKET;
      printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><ExposeHeader>Content-Length</ExposeHeader><ExposeHeader>Content-Type</ExposeHeader><ExposeHeader>Content-Disposition</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/cors.xml;
      rc bucket cors set local/$$$$S3_BUCKET /tmp/cors.xml;
      rc bucket cors set local/$$$$S3_APP_BACKUPS_BUCKET /tmp/cors.xml;
      exit"
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 20

  server:
    image: "${SERVER_IMAGE:-ghcr.io/sidekickdb/server:latest}"
    networks:
      - caddy
      - default
    healthcheck:
      # Liveness only: the web server starts last during boot. Not /health/system,
      # which reports a shared wal-errors row that a crashed process can leave
      # behind, keeping every later process unhealthy. Use /health/system for
      # monitoring WAL health.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    environment:
      # JVM flags. Defaults: heap up to 60% of the container memory limit, and
      # upstream's native-memory bounds (cap on cached NIO buffers, periodic
      # return of freed native memory). Setting JAVA_OPTS replaces all of them.
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=60 -Djdk.nio.maxCachedBufferSize=131072 -XX:TrimNativeHeapInterval=60000}"
      # SidekickDB runtime mode, see README.md. docker stack cannot nest
      # defaults; deploy-swarm.sh also accepts SIDEKICK_RUNTIME_MODE.
      INSTANT_RUNTIME_MODE: ${INSTANT_RUNTIME_MODE:-self-hosted}
      SWARM_SERVICE_NAME: server
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment; see .env.example}@postgres:5432/${POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: ${CONNECTION_POOL_SIZE:-20}
      # docker stack cannot fall back from one variable to another, so this
      # file reads only the INSTANT_* names. deploy-swarm.sh also accepts the
      # SIDEKICK_* names and passes them on under these.
      INSTANT_BACKEND_URL: ${SERVER_URL:? example http://server.localhost}
      INSTANT_DASHBOARD_URL: ${DASHBOARD_URL:? example http://dash.localhost}
      INSTANT_SUPERUSER_EMAIL: ${INSTANT_SUPERUSER_EMAIL:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # DNS-over-HTTPS resolvers for outbound requests (webhooks, OAuth); "system"
      # uses the system resolver. Unset means Cloudflare and Google DoH.
      INSTANT_DNS_OVER_HTTPS_URLS: ${INSTANT_DNS_OVER_HTTPS_URLS:-}
      # Weight limit of each app's query cache, in bytes or with a k, m or g
      # suffix. Unset means a quarter of the server's maximum heap.
      INSTANT_QUERY_CACHE_MAX_BYTES: ${INSTANT_QUERY_CACHE_MAX_BYTES:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      SENDGRID_TOKEN: ${SENDGRID_TOKEN:-}
      RESEND_TOKEN: ${RESEND_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INSTANT_EMAIL_PROVIDER: ${INSTANT_EMAIL_PROVIDER:-}
      INSTANT_EMAIL_REPLY_TO: ${INSTANT_EMAIL_REPLY_TO:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_NAME: ${INSTANT_DASHBOARD_EMAIL_SENDER_NAME:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL: ${INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL:-}
      INSTANT_APP_EMAIL_SENDER_NAME: ${INSTANT_APP_EMAIL_SENDER_NAME:-}
      INSTANT_APP_EMAIL_SENDER_EMAIL: ${INSTANT_APP_EMAIL_SENDER_EMAIL:-}
      INSTANT_TEAM_EMAIL_SENDER_NAME: ${INSTANT_TEAM_EMAIL_SENDER_NAME:-}
      INSTANT_TEAM_EMAIL_SENDER_EMAIL: ${INSTANT_TEAM_EMAIL_SENDER_EMAIL:-}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in the environment; see .env.example (formerly MINIO_ROOT_USER)}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in the environment; see .env.example (formerly MINIO_ROOT_PASSWORD)}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:? example http://storage.localhost}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
      # RustFS 1.0.6 rejects uploads that carry Content-Encoding twice ("duplicate
      # header: content-encoding"). Backups set Content-Encoding: zstd, and the AWS
      # SDK's default checksum mode adds aws-chunked. when_required avoids that.
      AWS_REQUEST_CHECKSUM_CALCULATION: ${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}
    secrets:
      - source: server_config
        target: /app/resources/config/override.edn
    deploy:
      replicas: 2
      resources:
        limits:
          memory: ${SERVER_MEMORY_LIMIT:-2g}
      labels:
        caddy: ${SERVER_URL:? ex http://server.localhost}
        caddy.reverse_proxy: "{{upstreams 8888}}"

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    deploy:
      placement:
        constraints:
          - node.labels.caddy==true

volumes:
  backend-db:
  storage_data:
  caddy_data:

secrets:
  server_config:
    external: true

networks:
  caddy:
    external: true

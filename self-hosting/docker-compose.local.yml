# LOCAL DEVELOPMENT ONLY. This file builds the server and dashboard from
# source and falls back to well-known credentials (Postgres password "pass",
# storage keys "rustfsadmin") when .env does not set them. Every port is bound
# to 127.0.0.1 so those credentials are not reachable from other machines.
# Do not use it for a deployment; use docker-compose.yml,
# docker-compose.with-caddy.yml or swarm.yml, which require real secrets.
services:
  postgres:
    # Needs Postgres 17 with the pg_hint_plan and wal2json extensions.
    image: ${POSTGRES_IMAGE:-ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan}
    ports:
      - "127.0.0.1:8890:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - "backend-db:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-instant}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"

  www:
    depends_on:
      server:
        condition: service_healthy
    # Local build tag. Kept off ghcr.io/instantdb so it never shadows upstream images.
    image: "${DASHBOARD_IMAGE:-sidekickdb-dashboard:local}"
    build:
      context: ../client
      dockerfile: Dockerfile.www
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dash').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      # Where the backend url will be available externally
      - INSTANT_BACKEND_URL=${SIDEKICK_BACKEND_URL:-${INSTANT_BACKEND_URL:-http://localhost:8888}}
      # Shows "Continue with Google" on the login page when set.
      - INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID=${SIDEKICK_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}}

  storage:
    # S3-compatible object storage. Defaults to RustFS; STORAGE_IMAGE can point at
    # another S3-compatible server (adjust environment and healthcheck to match).
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.6}
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  createbuckets:
    # Creates the buckets with the RustFS client `rc`. Any image with `sh` and `rc`
    # works here; another client needs a different entrypoint.
    # RustFS sends no CORS headers unless a bucket has CORS rules (MinIO allowed
    # every origin by default), so GET/HEAD from any origin is allowed on both
    # buckets. Access still needs a presigned URL.
    image: ${STORAGE_CLIENT_IMAGE:-rustfs/rc:v0.1.38}
    environment:
      ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      rc alias set local http://storage:9000 $$ACCESS_KEY $$SECRET_KEY;
      rc bucket create --ignore-existing local/$$S3_BUCKET;
      rc bucket create --ignore-existing local/$$S3_APP_BACKUPS_BUCKET;
      printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><ExposeHeader>Content-Length</ExposeHeader><ExposeHeader>Content-Type</ExposeHeader><ExposeHeader>Content-Disposition</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' > /tmp/cors.xml;
      rc bucket cors set local/$$S3_BUCKET /tmp/cors.xml;
      rc bucket cors set local/$$S3_APP_BACKUPS_BUCKET /tmp/cors.xml;
      exit"

  server:
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    # Local build tag. Kept off ghcr.io/instantdb so it never shadows upstream images.
    image: "${SERVER_IMAGE:-sidekickdb-server:local}"
    build:
      context: ../server
      dockerfile: Dockerfile.self-hosted
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      # Liveness only: the web server starts last during boot. Not /health/system,
      # which reports a shared wal-errors row that a crashed process can leave
      # behind, keeping every later process unhealthy. Use /health/system for
      # monitoring WAL health.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    mem_limit: ${SERVER_MEMORY_LIMIT:-2g}
    environment:
      # JVM flags. Defaults: heap up to 60% of the container memory limit, and
      # upstream's native-memory bounds (cap on cached NIO buffers, periodic
      # return of freed native memory). Setting JAVA_OPTS replaces all of them.
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=60 -Djdk.nio.maxCachedBufferSize=131072 -XX:TrimNativeHeapInterval=60000}"
      # SidekickDB runtime mode: "self-hosted" (default here) or "default";
      # see README.md, "Runtime mode".
      INSTANT_RUNTIME_MODE: ${SIDEKICK_RUNTIME_MODE:-${INSTANT_RUNTIME_MODE:-self-hosted}}
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: ${CONNECTION_POOL_SIZE:-20}
      INSTANT_BACKEND_URL: ${SIDEKICK_BACKEND_URL:-${INSTANT_BACKEND_URL:-http://localhost:8888}}
      INSTANT_DASHBOARD_URL: ${SIDEKICK_DASHBOARD_URL:-${INSTANT_DASHBOARD_URL:-http://localhost:3000}}
      INSTANT_SUPERUSER_EMAIL: ${SIDEKICK_SUPERUSER_EMAIL:-${INSTANT_SUPERUSER_EMAIL:-}}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${SIDEKICK_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: ${SIDEKICK_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}}
      # DNS-over-HTTPS resolvers for outbound requests (webhooks, OAuth); "system"
      # uses the system resolver. Unset means Cloudflare and Google DoH.
      INSTANT_DNS_OVER_HTTPS_URLS: ${SIDEKICK_DNS_OVER_HTTPS_URLS:-${INSTANT_DNS_OVER_HTTPS_URLS:-}}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      SENDGRID_TOKEN: ${SENDGRID_TOKEN:-}
      RESEND_TOKEN: ${RESEND_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      INSTANT_EMAIL_PROVIDER: ${SIDEKICK_EMAIL_PROVIDER:-${INSTANT_EMAIL_PROVIDER:-}}
      INSTANT_EMAIL_REPLY_TO: ${SIDEKICK_EMAIL_REPLY_TO:-${INSTANT_EMAIL_REPLY_TO:-}}
      INSTANT_DASHBOARD_EMAIL_SENDER_NAME: ${SIDEKICK_DASHBOARD_EMAIL_SENDER_NAME:-${INSTANT_DASHBOARD_EMAIL_SENDER_NAME:-}}
      INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL: ${SIDEKICK_DASHBOARD_EMAIL_SENDER_EMAIL:-${INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL:-}}
      INSTANT_APP_EMAIL_SENDER_NAME: ${SIDEKICK_APP_EMAIL_SENDER_NAME:-${INSTANT_APP_EMAIL_SENDER_NAME:-}}
      INSTANT_APP_EMAIL_SENDER_EMAIL: ${SIDEKICK_APP_EMAIL_SENDER_EMAIL:-${INSTANT_APP_EMAIL_SENDER_EMAIL:-}}
      INSTANT_TEAM_EMAIL_SENDER_NAME: ${SIDEKICK_TEAM_EMAIL_SENDER_NAME:-${INSTANT_TEAM_EMAIL_SENDER_NAME:-}}
      INSTANT_TEAM_EMAIL_SENDER_EMAIL: ${SIDEKICK_TEAM_EMAIL_SENDER_EMAIL:-${INSTANT_TEAM_EMAIL_SENDER_EMAIL:-}}
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-instant-bucket}
      S3_APP_BACKUPS_BUCKET: ${S3_APP_BACKUPS_BUCKET:-instant-backups}
      # RustFS 1.0.6 rejects uploads that carry Content-Encoding twice ("duplicate
      # header: content-encoding"). Backups set Content-Encoding: zstd, and the AWS
      # SDK's default checksum mode adds aws-chunked. when_required avoids that.
      AWS_REQUEST_CHECKSUM_CALCULATION: ${AWS_REQUEST_CHECKSUM_CALCULATION:-when_required}
    volumes:
      - server_config:/app/resources/config

volumes:
  backend-db:
  storage_data:
  server_config:

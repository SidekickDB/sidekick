# SidekickDB: baseline measurement of the single-node self-hosted stack as
# shipped in self-hosting/docker-compose.yml (scripts/bench/self-hosted).
# Builds the server and dashboard images from this commit, then takes several
# cold-start samples: start-up time, per-service and JVM memory, and a small
# live-query workload. Results are uploaded as an artifact; baselines that are
# kept are committed under scripts/bench/self-hosted/results/.
#
# Read-only: no secrets, no write permissions, nothing is pushed or published.
# It runs on demand, and on pull requests that change the harness, this
# file, or what the dashboard image carries and serves (client/Dockerfile.www,
# client/www/next.config.js, client/www/public). A pull request that changes
# only results/ does not start it; on one that also changes the harness,
# every push runs it, because GitHub matches the paths against the whole pull
# request.
#
# A pull request run is a check that the harness still works, not a baseline:
# one runtime mode, a short idle wait, and a server image built with the
# layer cache of the image release workflow. A baseline is a run started by
# hand, which builds cold and uses the inputs below.
name: Self-hosted benchmark

on:
  workflow_dispatch:
    inputs:
      samples:
        description: Cold-start samples per runtime mode (at least 3)
        default: '3'
        required: true
      modes:
        description: Runtime modes to compare, alternating in one job
        default: 'default,self-hosted'
        required: true
      idle_seconds:
        description: Seconds to wait after start-up before the idle snapshot
        default: '120'
        required: true
  pull_request:
    paths:
      - 'scripts/bench/self-hosted/**'
      - '!scripts/bench/self-hosted/results/**'
      - '.github/workflows/sidekick-self-hosted-bench.yml'
      - 'client/Dockerfile.www'
      - 'client/www/next.config.js'
      - 'client/www/public/**'

permissions:
  contents: read

concurrency:
  group: sidekick-self-hosted-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Self-hosted benchmark
    # A pinned image, so baselines from different runs are comparable.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BENCH_RUNNER_LABEL: ubuntu-24.04
      SAMPLES: ${{ inputs.samples || '3' }}
      # A pull request gets the short profile; a run started by hand gets
      # its inputs.
      MODES: ${{ github.event_name == 'pull_request' && 'self-hosted' || inputs.modes || 'default,self-hosted' }}
      IDLE_SECONDS: ${{ github.event_name == 'pull_request' && '20' || inputs.idle_seconds || '120' }}
      # The commit under test: the PR head, not GitHub's merge commit.
      GITHUB_SHA_UNDER_TEST: ${{ github.event.pull_request.head.sha || github.sha }}
      # Chromium for the browser smoke check. Must match the playwright
      # version in client/pnpm-lock.yaml (checked below), as in sidekick-e2e.yml.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.2.0'

      - name: Setup Node.js environment
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      # Synthetic results only, a second; fails before the long run starts.
      - name: Test the summary on synthetic results
        run: node --test scripts/bench/self-hosted/summarize.test.mjs

      - name: Check the Playwright image matches the lockfile
        run: |
          v=$(echo "$PLAYWRIGHT_IMAGE" | sed -E 's/.*:v([0-9.]+)-.*/\1/')
          grep -q "^  playwright@$v:" client/pnpm-lock.yaml || {
            echo "::error::PLAYWRIGHT_IMAGE is v$v; client/pnpm-lock.yaml has another playwright version"
            exit 1
          }

      - name: Get pnpm cache directory path
        id: pnpm-cache-dir-path
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.pnpm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Build @sidekickdb/core for the workload client
        working-directory: client
        env:
          TURBO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm i --frozen-lockfile --prefer-offline
          pnpm exec turbo run build --filter='@sidekickdb/core...' --no-update-notifier

      # Does this Compose evaluate a nested ${A:-${B:?...}} when A is set?
      # self-hosting/docker-compose.yml reads the storage keys that way. Shown
      # next to the Compose version; it does not fail the job.
      - name: Probe Compose nested-default handling
        run: |
          dir=$(mktemp -d)
          printf 'services:\n  probe:\n    image: busybox\n    environment:\n      X: ${A:-${B:?need A or B}}\n' > "$dir/compose.yml"
          echo "Compose: $(docker compose version --short)"
          echo "--- A set, B unset (expect X: a)"
          env -u B A=a docker compose -f "$dir/compose.yml" config 2>&1 | grep -E 'X:|error|need' || true
          echo "--- A and B unset (expect an error naming 'need A or B')"
          env -u A -u B docker compose -f "$dir/compose.yml" config 2>&1 | grep -E 'X:|error|need' || true
          echo "--- A set to empty, B unset (expect the error)"
          env -u B A= docker compose -f "$dir/compose.yml" config 2>&1 | grep -E 'X:|error|need' || true

      # Pull requests only: build both images here and hand them to the
      # harness, which then skips its own cold build and its build timing.
      # The server build reads the layer cache the image release workflow
      # wrote (never written here), which saves the dependency download. The
      # dashboard build has no cache: nearly all of its time is the build of
      # the sources, which a layer cache cannot skip.
      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the server image from cache
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          file: ./server/Dockerfile.self-hosted
          load: true
          push: false
          provenance: false
          tags: sidekick-bench/server:local
          cache-from: type=gha,scope=server-amd64

      - name: Build the dashboard image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./client
          file: ./client/Dockerfile.www
          load: true
          push: false
          provenance: false
          tags: sidekick-bench/dashboard:local

      # The dashboard image serves only the dashboard, the docs and the admin
      # tools, and carries only the public/ files they load
      # (client/Dockerfile.www, client/www/next.config.js). Every same-origin
      # file that the server-rendered HTML of a few served pages (and their
      # stylesheets) asks for must answer 200; files that only client-side
      # rendering requests are not seen. HTTP answers only: the browser smoke
      # check of the benchmark run signs in, opens the code editor and the
      # devtool.
      - name: Check what the dashboard image serves
        if: github.event_name == 'pull_request'
        env:
          IMAGE: sidekick-bench/dashboard:local
          # www/public was about 104 MB in v2.0.0 and 3,152,829 bytes without
          # the code editor; public/monaco (Monaco and the @sidekickdb/core
          # types) adds 14,073,600 bytes; with it, 17,623,741 bytes on pull
          # request #107. Raise this bound when the image gains files on
          # purpose.
          MAX_PUBLIC_BYTES: '20000000'
          # The pages scanned below ask for far more files than this.
          MIN_PAGE_FILES: '10'
        run: |
          fail=0
          trap 'docker rm -f dash-check > /dev/null 2>&1 || true' EXIT
          docker run -d --name dash-check -p 127.0.0.1:3999:3000 \
            -e SIDEKICK_API_URI=http://127.0.0.1:8888 "$IMAGE" > /dev/null
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:3999/dash && break
            sleep 1
          done
          for p in /dash /logout /_devtool /docs /docs/instaql /docs/instaql.md \
            /docs.md /llms.txt /llms-full.txt /docs/auth/magic-codes.md \
            /docs/self-hosting/vps.md /llm-rules/AGENTS.md /intern /intern/storage \
            /intern/restore /intern/deployment-settings \
            /fonts/Switzer-Regular.woff /img/docs/devtool-explorer.png \
            /img/google_g.svg /publicSelfHostedVariables.js \
            /native-file-system-adapter-sw.js /monaco/vs/loader.js \
            /monaco/vs/editor/editor.main.js /monaco/vs/editor/editor.main.css \
            /monaco/types/index.d.ts; do
            got=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3999$p" || true)
            echo "$got $p"
            [ "$got" = 200 ] || { echo "::error::$p: expected 200, got $got"; fail=1; }
          done
          for p in /pricing /status /discord /intern/emails /intern/emails/feb2026 \
            /intern/investor_updates /intern/sunset /intern/overview \
            /posts/heroui/stars.png /audio/habanera.mp3 /api/avatar \
            /img/icon/favicon-32x32.png /sitemap.xml /rss.xml; do
            got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:3999$p" || true)
            echo "$got $p"
            case "$got" in
              "404 "|30[78]" http://127.0.0.1:3999/dash") ;;
              *) echo "::error::$p: expected a redirect to /dash or 404, got $got"; fail=1 ;;
            esac
          done
          echo "--- files the served pages ask for"
          base=http://127.0.0.1:3999
          refs=$(mktemp)
          for page in /docs /docs/instaql /dash /intern /platform/oauth/start; do
            html=$(curl -s -w '\n%{http_code}' "$base$page" || true)
            code=$(printf '%s' "$html" | tail -n1)
            if [ "$code" != 200 ]; then
              echo "$code $page (not scanned)"
              [ "$page" = /platform/oauth/start ] || { echo "::error::$page: expected 200, got $code"; fail=1; }
              continue
            fi
            printf '%s' "$html" | grep -oE '(src|href)="/[^"]*"' | sed -E 's/^[a-z]+="//; s/"$//' >> "$refs" || true
          done
          for css in $(grep -E '^/_next/static/.*\.css$' "$refs" | sort -u || true); do
            curl -s "$base$css" | grep -oE "url\([\"']?/[^)\"']*" | sed -E "s/^url\([\"']?//" >> "$refs" || true
          done
          checked=0
          static=0
          for f in $(sed -E 's/[?#].*//' "$refs" | grep -E '^/(_next/static/|img/|fonts/|llm-rules/|[^/]+\.[A-Za-z0-9]+$)' | sort -u || true); do
            got=$(curl -s -o /dev/null -w '%{http_code}' "$base$f" || true)
            echo "$got $f"
            [ "$got" = 200 ] || { echo "::error::$f, asked for by a served page: expected 200, got $got"; fail=1; }
            checked=$((checked + 1))
            case "$f" in /_next/static/*) static=$((static + 1)) ;; esac
          done
          echo "Checked $checked files, $static under /_next/static/"
          # An empty scan would pass the loop above: fail it instead.
          [ "$checked" -ge "$MIN_PAGE_FILES" ] || { echo "::error::only $checked files found in the served pages, expected at least $MIN_PAGE_FILES"; fail=1; }
          [ "$static" -gt 0 ] || { echo "::error::no /_next/static/ file found in the served pages"; fail=1; }
          echo "--- www/public in the image"
          docker run --rm --entrypoint sh "$IMAGE" -c 'cd /app/www/public && find . -maxdepth 2 | sort'
          for d in posts audio marketing video-previews readmes img/icon \
            img/emails img/essays img/investors img/startups img/hiring \
            img/peeps img/about img/landing img/showcase img/product-pages; do
            if docker run --rm --entrypoint test "$IMAGE" -e "/app/www/public/$d"; then
              echo "::error::www/public/$d is in the image"; fail=1
            fi
          done
          public=$(docker run --rm --entrypoint du "$IMAGE" -sb /app/www/public | cut -f1)
          echo "Size: www/public $public bytes, image $(docker image inspect -f '{{.Size}}' "$IMAGE") bytes"
          [ "$public" -le "$MAX_PUBLIC_BYTES" ] || { echo "::error::www/public is $public bytes, more than $MAX_PUBLIC_BYTES"; fail=1; }
          exit $fail

      - name: Pull the Playwright image
        run: |
          t0=$(date +%s)
          docker pull --quiet "$PLAYWRIGHT_IMAGE"
          echo "Pulled in $(( $(date +%s) - t0 )) s"

      - name: Run the benchmark
        env:
          SKIP_BUILD: ${{ github.event_name == 'pull_request' && '--skip-build' || '' }}
        run: |
          node scripts/bench/self-hosted/run.mjs $SKIP_BUILD \
            --samples "$SAMPLES" \
            --modes "$MODES" \
            --idle-seconds "$IDLE_SECONDS" \
            --browser-image "$PLAYWRIGHT_IMAGE" \
            --out "$RUNNER_TEMP/bench-out"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/bench-out/summary.md" ]; then
            cat "$RUNNER_TEMP/bench-out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: self-hosted-bench-${{ env.GITHUB_SHA_UNDER_TEST }}
          path: ${{ runner.temp }}/bench-out
          retention-days: 30

      - name: Remove containers and volumes
        if: always()
        run: |
          docker rm -f sidekickbench-browser > /dev/null 2>&1 || true
          docker ps -aq --filter label=com.docker.compose.project=sidekickbench | xargs -r docker rm -f
          docker volume ls -q --filter label=com.docker.compose.project=sidekickbench | xargs -r docker volume rm

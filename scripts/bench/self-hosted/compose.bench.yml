# The only change the benchmark makes to self-hosting/docker-compose.yml:
# publish the server and the storage API on loopback so the workload and the
# smoke checks can reach them (file URLs are presigned for
# S3_PUBLIC_ENDPOINT, http://localhost:9000 in .env.example). Everything else
# (images, memory limit, JAVA_OPTS, healthchecks, volumes) is the shipped file.
services:
  server:
    ports:
      - "127.0.0.1:8888:8888"
  storage:
    ports:
      - "127.0.0.1:9000:9000"
